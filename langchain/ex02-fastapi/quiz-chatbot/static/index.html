<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>리뷰 분석 스트리밍 테스트</title>
</head>
<body>
  <h1>친절한 chat bot</h1>
  <hr>
  <div style="width: 280px; height: 300px; background-color: aliceblue; overflow:auto;">
    <div id="out"></div>
  </div>
  <textarea id="text" rows="3" cols="40">안녕! 내이름은 홍길동이야</textarea>
  <br>
  <button id="go">전송</button>

  <hr>

  <script>
    const text = document.getElementById("text"); // 서버로 전송할 질문

    document.getElementById("go").addEventListener("click", async () => {
      const out = document.getElementById("out");
      const btn = document.getElementById("go");
      const value = text.value.trim();
      if (!value) return;
      btn.disabled = true;

      // 1) 사용자 메시지 추가
      const userMsg = document.createElement("div");
      userMsg.textContent = "🙋 " + value;
      userMsg.style.color = "red"
      out.appendChild(userMsg);

      // 2) 봇 메시지용 div 미리 생성 (스트리밍은 여기에만 누적)
      const botMsg = document.createElement("div");
      botMsg.style.whiteSpace = "pre-wrap";  // 줄바꿈/공백 보존 + 자동 줄바꿈
      botMsg.textContent = "🤖 ";
      out.appendChild(botMsg);
      out.scrollTop = out.scrollHeight;

      try {
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: value }),
        });
        const reader = resp.body.getReader();   // 응답을 스트림으로 읽는 객체
        const decoder = new TextDecoder();      // 바이트를 문자로 변환
        while (true) {
          const { done, value: chunk } = await reader.read();  // 바깥 value와 이름 충돌 방지
          if (done) break;
          botMsg.textContent += decoder.decode(chunk, { stream: true });
        }
      } catch (e) {
        botMsg.textContent += "[에러] " + e.message;
      } finally {
        btn.disabled = false;
        text.value = "";  // 입력창 비우기
      }
    });
  </script>

</body>
</html>
